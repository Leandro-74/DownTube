name: Build Windows executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/downtube
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala o PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Baixa o ffmpeg (Windows)
        shell: pwsh
        run: |
          $urls = @(
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          )
          foreach ($url in $urls) {
            Remove-Item "ffmpeg.zip" -ErrorAction SilentlyContinue
            try {
              Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip"
              break
            } catch {
              Write-Warning "Falha ao baixar $url : $_"
            }
          }
          if (-not (Test-Path "ffmpeg.zip")) { throw "Nenhum mirror do ffmpeg disponível" }
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          $bin = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $bin.FullName -Destination "ffmpeg.exe"
          $binProbe = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $binProbe.FullName -Destination "ffprobe.exe"

      - name: Baixa o bgutil-pot (PO Token provider)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/jim60105/bgutil-ytdlp-pot-provider-rs/releases/download/v0.8.1/bgutil-pot-windows-x86_64.exe" -OutFile "bgutil-pot.exe"

      - name: Baixa o deno (JS runtime exigido pelo yt-dlp)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive -Path "deno.zip" -DestinationPath "deno_extracted"
          Copy-Item "deno_extracted/deno.exe" -Destination "deno.exe"

      - name: Gera o executável com PyInstaller
        run: |
          pyinstaller --onefile --console --name downtube `
            --icon "icon.ico" `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            --add-binary "bgutil-pot.exe;." `
            --add-binary "deno.exe;." `
            --add-data "yt-dlp-plugins;yt-dlp-plugins" `
            main.py

      - name: Sobe o .exe como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: downtube-windows
          path: src/downtube/dist/downtube.exe

      - name: Extrai a seção da versão no CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $versao = "${{ github.ref_name }}" -replace '^v', ''
          $padrao = '(?ms)^##\s*\[' + [regex]::Escape($versao) + '\][^\n]*\n(.*?)(?=^##\s|\z)'
          $secao = [regex]::Match((Get-Content "$env:GITHUB_WORKSPACE\CHANGELOG.md" -Raw -Encoding utf8), $padrao)
          if (-not $secao.Success) { throw "Sem a seção [$versao] no CHANGELOG.md" }
          $secao.Groups[1].Value.Trim() | Out-File -FilePath "$env:GITHUB_WORKSPACE\release_body.md" -Encoding utf8

      - name: Anexa o .exe na Release (quando disparado por tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ github.workspace }}/release_body.md
          files: src/downtube/dist/downtube.exe
